<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>MeshUtilz Sweep Lab v0.2</title><link rel="stylesheet" href="./src/styles.css"/></head><body><div id="app">
<header><strong>MeshUtilz</strong><span>Sweep Lab v0.2</span></header>
<aside>
<div class="row"><button id="drawBtn" class="active">Draw Path</button><button id="orbitBtn">Orbit</button></div>
<label>Drawing plane<select id="plane"><option value="XZ">XZ — Ground</option><option value="XY">XY — Front</option><option value="YZ">YZ — Side</option></select></label>
<label>Profile<select id="profile"><option value="circle">Circle</option><option value="square">Square</option><option value="triangle">Triangle</option><option value="rectangle">Rectangle</option></select></label>
<label>Size <input id="size" type="range" min="0.05" max="1.5" value="0.3" step="0.05"><output id="sizeOut">0.30</output></label>
<label>Path smoothness <input id="smooth" type="range" min="2" max="12" value="5" step="1"></label>
<label>Circle sides <input id="sides" type="range" min="6" max="32" value="12" step="1"><output id="sidesOut">12</output></label>
<div class="checks"><label><input id="caps" type="checkbox" checked> Cap ends</label><label><input id="wire" type="checkbox"> Wireframe</label></div>
<div class="row"><button id="undoBtn">Undo</button><button id="redoBtn">Redo</button></div>
<div class="row"><button id="deleteBtn">Delete Selected</button><button id="clearBtn">Clear All</button></div>
<p class="hint">Each Pencil stroke becomes a separate sweep. In Orbit mode, tap a sweep to select it.</p>
</aside><main id="viewport"></main><footer><span id="status">Ready — draw a path</span><span>Experimental branch: sweep-v0.2</span></footer></div>
