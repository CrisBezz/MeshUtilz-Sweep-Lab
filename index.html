<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><title>MeshUtilz Balloon v0.6</title><link rel="stylesheet" href="./src/styles.css"/></head><body><div id="app"><header><strong>MeshUtilz</strong><span>Balloon v0.6</span></header><aside><div class="row"><button id="drawBtn" class="active">Draw Balloon</button><button id="orbitBtn">Orbit / Select</button></div><label>Drawing plane<select id="plane"><option value="XZ">XZ — Ground</option><option value="XY">XY — Front</option><option value="YZ">YZ — Side</option></select></label><label>Balloon width <input id="width" type="range" min="0.08" max="1.8" value="0.42" step="0.02"><output id="widthOut">0.42</output></label><label>Pressure influence <input id="pressure" type="range" min="0" max="1" value="0.65" step="0.05"><output id="pressureOut">65%</output></label><label>Stroke smoothing <input id="smooth" type="range" min="2" max="10" value="5" step="1"><output id="smoothOut">5</output></label><label>Roundness <input id="sides" type="range" min="8" max="28" value="16" step="2"><output id="sidesOut">16</output></label><div class="checks"><label><input id="wire" type="checkbox"> Wireframe</label><label><input id="taper" type="checkbox" checked> Soft end taper</label></div><div id="selectionPanel" class="selection-panel"><strong id="selectionLabel">No balloon selected</strong><div class="row"><button id="applyBtn" disabled>Apply Controls</button><button id="duplicateBtn" disabled>Duplicate</button></div></div><div class="row"><button id="undoBtn">Undo</button><button id="redoBtn">Redo</button></div><div class="row"><button id="deleteBtn">Delete Selected</button><button id="clearBtn">Clear All</button></div><a id="exportBtn" class="primary export-link disabled" href="#">Save All — OBJ</a><p class="hint">Draw one Pencil stroke. Width creates the volume; Apple Pencil pressure can vary local thickness. Release to finish
