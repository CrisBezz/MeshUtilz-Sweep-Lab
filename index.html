<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>MeshUtilz Sweep Lab v0.1</title>
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
<div id="app">
  <header><strong>MeshUtilz</strong><span>Sweep Lab v0.1</span></header>
  <aside>
    <button id="drawBtn" class="active">Draw Path</button>
    <button id="orbitBtn">Orbit</button>
    <label>Profile<select id="profile"><option value="circle">Circle</option><option value="square">Square</option><option value="triangle">Triangle</option><option value="rectangle">Rectangle</option></select></label>
    <label>Size <input id="size" type="range" min="0.05" max="1.5" value="0.3" step="0.05"><output id="sizeOut">0.30</output></label>
    <label>Path smoothness <input id="smooth" type="range" min="2" max="12" value="5" step="1"></label>
    <label>Circle sides <input id="sides" type="range" min="6" max="32" value="12" step="1"><output id="sidesOut">12</output></label>
    <label><input id="caps" type="checkbox" checked> Cap ends</label>
    <div class="row"><button id="undoBtn">Undo</button><button id="clearBtn">Clear</button></div>
    <p class="hint">Draw directly on the ground plane with mouse, touch or Apple Pencil. Switch to Orbit to inspect the mesh.</p>
  </aside>
  <main id="viewport"></main>
  <footer><span id="status">Ready — draw a path</span><span>Experimental branch: sweep-v0.1</span></footer>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
